<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario</title>
</head>
<body>

    <h1>Formulario de Información Personal</h1>
    <form th:action="@{/projects/save}" th:object="${projectDto}" method="post" enctype="multipart/form-data">
        <div>
            <label for="title">Título: </label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>
        <div>
            <label for="description">Description: </label>
            <textarea type="text" id="description" th:field="*{description}" required></textarea>
        </div>
        <div>
            <label for="projectUrl">URL del Proyecto: </label>
            <input type="url" id="projectUrl" th:field="*{projectUrl}">
        </div>
        <div>
            <label>Imágen del Proyecto: </label>
            <input type="file" name="file" required>
        </div>
        <div>
            <label>ID Información Personal: </label>
            <input type="number" th:field="*{personalInfoId}" required>
        </div>

        <button type="submit">Guardar</button>
    </form>

</body>
</html>
